[mouse]
# Configurações otimizadas para navegação web
enabled = true
tick_rate = 24
deadzone = 0.10
sensitivity = 28.0

[bindings]
# Navegação básica
BTN_SOUTH = KEY_ENTER
BTN_EAST = KEY_ESC
BTN_WEST = BTN_MIDDLE

# Navegação no Firefox
BTN_TL = BTN_SIDE
BTN_TR = BTN_EXTRA

# Controles de página
BTN_TL2 = KEY_PAGEUP
BTN_TR2 = KEY_PAGEDOWN

# Teclas úteis
BTN_START = KEY_ENTER
BTN_SELECT = KEY_ESC
BTN_MODE = KEY_TAB

# Atalhos úteis
BTN_NORTH = KEY_F5
BTN_THUMBL = KEY_HOME
BTN_THUMBR = KEY_END

[dpad]
enabled = true

[debug]
enabled = false
