<?xml version="1.0"?>
<systemList>
  <system>
        <fullname>Firefox</fullname>
        <name>firefox</name>
        <manufacturer>ports</manufacturer>
        <release>None</release>
        <hardware>ports</hardware>
        <path>/userdata/roms/firefox</path>
        <extension>.sh .squashfs</extension>
        <command>emulatorlauncher %CONTROLLERSCONFIG% -system ports -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname ports</command>
        <platform>pc</platform>
        <theme>desktop</theme>
        <group></group>
        <emulators>
            <emulator name="sh">
                <cores>
                    <core default="true">sh</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>